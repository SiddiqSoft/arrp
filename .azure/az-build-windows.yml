# ============================================================================
# Azure Pipelines Windows Build Template
# ============================================================================
#
# Purpose: Build the project on Windows with MSVC compiler
# Called by: azure-pipelines.yml (StgBldWindows stage)
# Triggers: When RunWindows parameter is true
#
# This template:
# 1. Builds the project on Windows with MSVC compiler
# 2. Supports x64 and arm64 architectures
# 3. Runs tests (optional)
# 4. Creates NuGet packages
# 5. Publishes build artifacts

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: displayName
    type: string

  - name: architectures
    type: stringList
    default: [ x64, arm64 ]
    values: [ x64, arm64 ]

  - name: compilers
    type: stringList
    default: [ MSVC ]
    values: [ MSVC ]

  - name: buildTypes
    type: stringList
    default: [ Release, Debug ]
    values: [ Release, Debug ]

  - name: runTests
    type: boolean
    default: true

  - name: publishNuGet
    type: boolean
    default: false


# ============================================================================
# JOBS
# ============================================================================
jobs:
  - ${{ each arch in parameters.architectures }}:
    - ${{ each compiler in parameters.compilers }}:
        - ${{ each buildType in parameters.buildTypes }}:
          - job: Job_Windows_${{ arch }}_${{ compiler }}_${{ buildType }}
            displayName: "Build Windows ${{ arch }} with ${{ compiler }} (${{ buildType }})"
            
            #condition: eq('${{ arch }}', $(Agent.OSArchitecture))
            
            workspace:
              clean: all
            
            pool:
              name: Default
              ${{ if or(eq(arch, 'x64'), eq(arch, 'X64')) }}:
                demands:
                  - Agent.OS -equals Windows_NT
                  - Agent.OSArchitecture -equals X64
              ${{ else }}:
                demands:
                  - Agent.OS -equals Windows_NT

            variables:
              cmakePreset: Windows-${{ arch }}-${{ buildType }}
              buildType: ${{ buildType }}

            steps:
              # ====================================================================
              # Checkout & Cleanup
              # ====================================================================
              - checkout: self
                name: step1

              # ====================================================================
              # Environment Setup
              # ====================================================================
              - powershell: |
                  # 1. Determine host and target architectures
                  $hostArch = "$env:AGENT_OSARCHITECTURE".ToLower()
                  if ($hostArch -eq "amd64" -or $hostArch -eq "x64") { $hostArch = "x64" }
                  elseif ($hostArch -eq "arm64") { $hostArch = "arm64" }
                  else { $hostArch = "x86" }

                  $targetArch = "${{ arch }}".ToLower()
                  if ($targetArch -eq "amd64") { $targetArch = "x64" }

                  if ($hostArch -eq $targetArch) {
                    $vcvarsArg = $targetArch
                  } else {
                    $vcvarsArg = "${hostArch}_${targetArch}"
                  }

                  Write-Host "Configured vcvarsall argument: $vcvarsArg (Host: $hostArch, Target: $targetArch)"

                  # 2. Locate vswhere.exe
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  if (-not (Test-Path $vswhere)) {
                    $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
                  }
                  if (-not (Test-Path $vswhere)) {
                    Write-Error "vswhere.exe not found at $vswhere"
                    exit 1
                  }

                  # 3. Locate Visual Studio installation
                  $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $vsPath) {
                    $vsPath = & $vswhere -latest -property installationPath
                  }
                  if (-not $vsPath) {
                    Write-Error "Visual Studio installation not found"
                    exit 1
                  }
                  Write-Host "Found Visual Studio at: $vsPath"

                  $vcvarsPath = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
                  if (-not (Test-Path $vcvarsPath)) {
                    Write-Error "vcvarsall.bat not found at: $vcvarsPath"
                    exit 1
                  }
                  Write-Host "Found vcvarsall.bat at: $vcvarsPath"

                  # 4. Snapshot current environment
                  $oldEnv = @{}
                  Get-ChildItem env: | ForEach-Object { $oldEnv[$_.Name] = $_.Value }

                  # 5. Execute vcvarsall.bat in a temporary batch script and capture environment
                  $tempBat = [System.IO.Path]::Combine([System.IO.Path]::GetTempPath(), "vcvars_" + [System.Guid]::NewGuid().ToString("N") + ".bat")
                  Set-Content -Path $tempBat -Value "@echo off`r`ncall `"$vcvarsPath`" $vcvarsArg`r`nset" -Encoding ASCII
                  $cmdOutput = & $tempBat
                  $exitCode = $LASTEXITCODE
                  Remove-Item -Path $tempBat -Force -ErrorAction SilentlyContinue

                  if ($exitCode -ne 0) {
                    Write-Error "vcvarsall.bat failed with exit code $exitCode"
                    exit $exitCode
                  }

                  # 6. Parse output of 'set'
                  $newEnv = @{}
                  foreach ($line in $cmdOutput) {
                    if ($line -match "^([^=]+)=(.*)$") {
                      $key = $matches[1].Trim()
                      $val = $matches[2]
                      if (-not $key.StartsWith("=")) {
                        $newEnv[$key] = $val
                      }
                    }
                  }

                  # 7. Prepend new PATH components using task.prependpath
                  $pathKey = $newEnv.Keys | Where-Object { $_ -ieq "PATH" } | Select-Object -First 1
                  if ($pathKey) {
                    $oldPathKey = $oldEnv.Keys | Where-Object { $_ -ieq "PATH" } | Select-Object -First 1
                    $oldPaths = if ($oldPathKey) { @($oldEnv[$oldPathKey] -split ';' | Where-Object { $_ -ne "" }) } else { @() }
                    $newPaths = @($newEnv[$pathKey] -split ';' | Where-Object { $_ -ne "" })
                    $addedPaths = @($newPaths | Where-Object { $oldPaths -notcontains $_ })

                    for ($i = $addedPaths.Count - 1; $i -ge 0; $i--) {
                      $p = $addedPaths[$i]
                      Write-Host "##vso[task.prependpath]$p"
                    }
                    Write-Host "Prepended $($addedPaths.Count) paths to PATH"
                  }

                  # 8. Export all other changed/new environment variables
                  $exportedCount = 0
                  foreach ($key in $newEnv.Keys) {
                    if ($key -ieq "PATH") { continue }
                    $newVal = $newEnv[$key]
                    $oldVal = $oldEnv[$key]
                    if ($null -eq $oldVal -or $newVal -ne $oldVal) {
                      Write-Host "##vso[task.setvariable variable=$key]$newVal"
                      $exportedCount++
                    }
                  }
                  Write-Host "Exported $exportedCount environment variables for ${{ compiler }} (${{ arch }})"
                displayName: Setup ${{ compiler }} environment for ${{ arch }}

              - template: az-pretest-windows.yml
                parameters:
                  architecture: ${{ arch }}
                  runTests: ${{ parameters.runTests }}
              
              # ====================================================================
              # Version Detection
              # ====================================================================
              - task: gitversion-setup@4
                displayName: Install GitVersion
                inputs:
                  versionSpec: 6.x
                  preferLatestVersion: true

              - task: gitversion-execute@4
                displayName: Determine Version
                name: version_step
                inputs:
                  useConfigFile: true
                  configFilePath: GitVersion.yml
                  updateBuildNumber: true
              
              # ====================================================================
              # Build Number
              # ====================================================================
              - task: PowerShell@2
                displayName: Set Build Number (Release)
                inputs:
                  targetType: inline
                  script: Write-Host "##vso[build.updateBuildNumber]$(GITVERSION_MAJORMINORPATCH)"
                condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

              - task: PowerShell@2
                displayName: Set Build Number (Pre-release)
                inputs:
                  targetType: inline
                  script: Write-Host "##vso[build.updateBuildNumber]$(GITVERSION_SEMVER)"
                condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))

              # ====================================================================
              # Build
              # ====================================================================
              - task: CMake@1
                displayName: CMake Configure
                inputs:
                  cmakeArgs: "--preset $(cmakePreset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH) -DCPM_SOURCE_CACHE=$(cpmCachePath)"
                  workingDirectory: $(System.DefaultWorkingDirectory)
              
              - task: CMake@1
                displayName: CMake Build
                inputs:
                  cmakeArgs: "--build --preset $(cmakePreset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH) -DCPM_SOURCE_CACHE=$(cpmCachePath)"
                  workingDirectory: $(System.DefaultWorkingDirectory)
                condition: succeeded()

              - task: PublishBuildArtifacts@1
                displayName: Publish Build Artifacts
                inputs:
                  PathtoPublish: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)
                  ArtifactName: build-$(cmakePreset)
                  publishLocation: Container
                condition: succeeded()
              
              # ====================================================================
              # Testing
              # ====================================================================
              - task: CMake@1
                displayName: CMake Tests
                inputs:
                  cmakeArgs: "-E chdir $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests ctest --output-junit $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests/results/$(cmakePreset)_test_detail.xml --output-on-failure"
                continueOnError: true
                condition: and(succeeded(), eq(${{ parameters.runTests }}, true))

              - template: az-posttest-windows.yml
                parameters:
                  runTests: ${{ parameters.runTests }}
                  architecture: ${{ arch }}
              
              - task: PublishTestResults@2
                displayName: Publish Test Results
                inputs:
                  testResultsFormat: JUnit
                  testRunTitle: Tests $(cmakePreset)
                  testResultsFiles: $(System.DefaultWorkingDirectory)/build/$(cmakePreset)/tests/results/$(cmakePreset)_test_detail.xml
                  mergeTestResults: false
                  buildConfiguration: $(BuildType)
                continueOnError: true
                condition: and(succeeded(), eq(${{ parameters.runTests }}, true))


              # ====================================================================
              # NuGet Packaging
              # ====================================================================
              - task: NuGetToolInstaller@1
                displayName: Install NuGet
                inputs:
                  versionSpec: ">=6.0.0-0"
                  checkLatest: true
                condition: and(succeeded(), eq(variables['BuildType'], 'Release'), eq('${{ arch }}', '${{ parameters.architectures[0] }}'), eq('${{ compiler }}', '${{ parameters.compilers[0] }}'), or(eq('${{ parameters.publishNuGet }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

              - task: NuGetCommand@2
                displayName: NuGet Pack
                inputs:
                  command: pack
                  packagesToPack: pack/*.nuspec
                  packDestination: $(Build.ArtifactStagingDirectory)
                  versioningScheme: off
                  buildProperties: VERSION=$(GITVERSION_MAJORMINORPATCH)
                condition: and(succeeded(), eq(variables['BuildType'], 'Release'), eq('${{ arch }}', '${{ parameters.architectures[0] }}'), eq('${{ compiler }}', '${{ parameters.compilers[0] }}'), or(eq('${{ parameters.publishNuGet }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

              - task: PublishBuildArtifacts@1
                displayName: Publish NuGet Artifacts
                inputs:
                  PathtoPublish: $(Build.ArtifactStagingDirectory)
                  ArtifactName: nuget-packages
                  publishLocation: Container
                condition: and(succeeded(), eq(variables['BuildType'], 'Release'), eq('${{ arch }}', '${{ parameters.architectures[0] }}'), eq('${{ compiler }}', '${{ parameters.compilers[0] }}'), or(eq('${{ parameters.publishNuGet }}', 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
