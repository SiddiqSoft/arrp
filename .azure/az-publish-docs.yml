# ============================================================================
# Azure Pipelines MkDocs GitHub Pages Publication Template
# ============================================================================
#
# Purpose: Build MkDocs documentation and publish to gh-pages branch
# Called by: azure-pipelines.yml (PublishDocs stage)
#
# This template:
# 1. Sets up Python 3 environment
# 2. Installs requirements from docs/requirements.txt and ghp-import
# 3. Builds MkDocs documentation site with --strict flag
# 4. Publishes built site to gh-pages branch via ghp-import
#
# ============================================================================

parameters:
  - name: displayName
    type: string
    default: "Publish MkDocs Documentation"

  - name: PublishDocs
    type: boolean
    default: true

  - name: dependsOn
    type: object
    default: []

jobs:
  - job: PublishMkDocs
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}

    pool:
      name: Default
      demands:
        - Agent.OS -equals Linux

    variables:
      GH_PAGES_BRANCH: gh-pages
      SITE_DIR: $(System.DefaultWorkingDirectory)/site

    steps:
      - checkout: self
        displayName: Checkout source code
        fetchDepth: 0

      - task: CmdLine@2
        displayName: "Install MkDocs dependencies"
        inputs:
          script: |
            python3 -m venv venv
            source venv/bin/activate
            python3 -m pip install --upgrade pip
            pip install -r docs/requirements.txt ghp-import
            echo "✓ Dependencies installed"
            mkdocs --version

      - task: gitversion-setup@4
        displayName: Install GitVersion
        inputs:
          versionSpec: 6.x
          preferLatestVersion: true

      - task: gitversion-execute@4
        displayName: Determine Version
        name: version_step
        inputs:
          useConfigFile: true
          configFilePath: GitVersion.yml
          updateBuildNumber: true

      - task: CmdLine@2
        displayName: "Build MkDocs site"
        inputs:
          script: |
            cd $(System.DefaultWorkingDirectory)
            source venv/bin/activate
            mkdocs build --strict --config-file mkdocs.yml
            echo "✓ MkDocs build completed successfully"
            ls -lFa $(System.DefaultWorkingDirectory)/site

      - task: CmdLine@2
        displayName: "Ensure gh-pages branch exists"
        inputs:
          script: |
            set -e
            git config --global user.email "${GITHUB_USER:-Azure Pipelines Bot}"
            git config --global user.name "Azure Pipelines Bot"

            # Configure authentication token if provided
            if [ -n "$(GITHUB_TOKEN)" ]; then
              git config --global url."https://$(GITHUB_TOKEN)@github.com/".insteadOf "https://github.com/"
            fi

            echo "Checking if branch '$(GH_PAGES_BRANCH)' exists on remote origin..."
            if ! git ls-remote --exit-code --heads origin $(GH_PAGES_BRANCH) > /dev/null 2>&1; then
              echo "Branch '$(GH_PAGES_BRANCH)' not found on remote origin. Creating initial orphan branch..."
              CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              git checkout --orphan $(GH_PAGES_BRANCH)
              git rm -rf . 2>/dev/null || true
              touch .nojekyll
              echo "<html><body>Initializing GitHub Pages...</body></html>" > index.html
              git add .nojekyll index.html
              git commit -m "Initialize $(GH_PAGES_BRANCH) branch [skip ci]"
              git push -u origin $(GH_PAGES_BRANCH)
              git checkout -f "$CURRENT_BRANCH"
              echo "✓ Successfully initialized and pushed '$(GH_PAGES_BRANCH)' branch to origin."
            else
              echo "✓ Branch '$(GH_PAGES_BRANCH)' already exists on remote origin."
            fi
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
        condition: and(succeeded(), eq(${{ parameters.PublishDocs }}, true))

      - task: CmdLine@2
        displayName: "Configure Git & Deploy to gh-pages via ghp-import"
        inputs:
          script: |
            set -e
            git config --global user.email "${GITHUB_USER:-Azure Pipelines Bot}"
            git config --global user.name "Azure Pipelines Bot"

            # Configure authentication token if provided
            if [ -n "$(GITHUB_TOKEN)" ]; then
              git config --global url."https://$(GITHUB_TOKEN)@github.com/".insteadOf "https://github.com/"
            fi

            echo "Deploying site to branch $(GH_PAGES_BRANCH)..."
            ghp-import -n -p -f $(System.DefaultWorkingDirectory)/site -b $(GH_PAGES_BRANCH) -m "Deploy documentation from Azure Pipelines build $(Build.BuildNumber) [skip ci]"

            echo "✓ Successfully deployed MkDocs documentation to $(GH_PAGES_BRANCH)"
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
        condition: and(succeeded(), eq(${{ parameters.PublishDocs }}, true))
